# Render.com blueprint — deploys the Dockerfile (ffmpeg included).
# Optimised for Render free tier (512 MB RAM).
services:
  - type: web
    name: feedforge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard (secret)
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: IMAGE_PROVIDER
        value: huggingface
      - key: HF_API_TOKEN
        sync: false
      - key: MEDIA_MODE
        value: video
      - key: PEXELS_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: fish
      - key: FISH_API_KEY
        sync: false
      - key: API_TOKEN
        sync: false          # set a value to protect /api/generate from quota abuse
      # ---- Memory-safe defaults for Render free tier (512 MB) ----
      - key: VIDEO_WIDTH
        value: "720"
      - key: VIDEO_HEIGHT
        value: "1280"
      - key: VIDEO_FPS
        value: "24"
      - key: DEFAULT_SCENE_COUNT
        value: "5"
